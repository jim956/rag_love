# 后端部署：API 直连宿主机上的 PostgreSQL 与 Milvus，只对外暴露 8000。
#
# 使用前在服务器上准备 .env（从 .env.example 复制），重点确认：
#   POSTGRES_URI / MILVUS_URI  写 127.0.0.1 —— 服务跟 API 在同一台机器上，
#                              host 网络模式下容器的回环地址就是宿主机。
#                              l.local / l 这类 mDNS、短主机名在容器里解析不了。
#   CORS_ORIGINS               前端页面的地址，逗号分隔（没有反代时必须填对）

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-love-api:latest
    container_name: rag-love-api
    restart: unless-stopped
    init: true # 回收 npx 子进程，避免僵尸进程堆积
    # PG / Milvus 就在宿主机上：共用 host 网络，容器里的 127.0.0.1 即宿主机。
    # 好处是不用改 PG 的 listen_addresses / pg_hba.conf，也不怕它只监听回环。
    network_mode: host
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    # host 模式下端口映射不起作用（Docker 会丢弃），uvicorn 直接绑宿主机 8000。
    #
    # 想换回 bridge 网络：删掉上面 network_mode: host，启用下面两项，
    # 并把 .env 里的地址改成 host.docker.internal（host 模式不支持 extra_hosts）。
    # ports:
    #   - "8000:8000"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    healthcheck:
      # 用 venv 里的 python 探活，镜像里没有 curl
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      # 冷启动要等 PG 连接池 + MCP 会话（npx 首次下载可能十几秒）
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"